- key: botta_packaging_2023
  path: "/publications/botta-packaging-2023/"
  title: Packaging code for reproducible research in the public sector
  date: "2023-05-01"
  year: 2023
  type: Journal Article
  venue: arXiv
  doi: 10.48550/arXiv.2305.16205
  url: "https://arxiv.org/abs/2305.16205"
  authors: "Federico Botta, Robin Lovelace, Laura Gilbert, Arthur Turrell"
  abstract: "The effective and ethical use of data to inform decision-making offers huge value to the public sector, especially when delivered by transparent, reproducible, and robust data processing workflows. One way that governments are unlocking this value is through making their data publicly available, allowing more people and organisations to derive insights. However, open data is not enough in many cases: publicly available datasets need to be accessible in an analysis-ready form from popular data science tools, such as R and Python, for them to realise their full potential. This paper explores ways to maximise the impact of open data with reference to a case study of packaging code to facilitate reproducible analysis. We present the jtstats project, which consists of R and Python packages for importing, processing, and visualising large and complex datasets representing journey times, for many modes and purposes at multiple geographic levels, released by the UK Department of Transport. jtstats shows how domain specific packages can enable reproducible research within the public sector and beyond, saving duplicated effort and reducing the risks of errors from repeated analyses. We hope that the jtstats project inspires others, particularly those in the public sector, to add value to their data sets by making them more accessible."

- key: vidal_tortosa_road_2023
  path: "/publications/vidal-tortosa-road-2023/"
  title: "Road lighting and cycling: A review of the academic literature and policy guidelines"
  date: "2023-12-01"
  year: 2023
  type: Journal Article
  venue: Journal of Cycling and Micromobility Research
  doi: 10.1016/j.jcmr.2023.100008
  url: ""
  authors: "Eugeni Vidal-Tortosa, Robin Lovelace"
  abstract: "Many studies have explored the impact of macro and meso attributes of the built environment such as population density, land use, proximity to services, and cycle infrastructure on cycling. Less attention has been paid to micro attributes of the built environment. This paper reviews the academic literature on the relationship between road lighting and cycling, and identifies gaps to provide direction to future work. It also reviews policy guidelines on lighting and cycling infrastructure. Findings from the review of academic research show a clear positive effect of road lighting on cycling. The effect seems stronger among potential and less experienced cyclists. This suggests that investment in road lighting may be a cost-effective intervention to increase cycling and make it more inclusive. More empirical work is needed, including on the impact that lighting may have on different types of cyclists and cycling, the optimal lighting for cyclists, the cost-effectiveness of lighting interventions, and in developing countries and countries at extreme latitudes. There is also a need for research with higher geographic and temporal resolution, “before/after” approaches to explore changes over time, and accounting for other factors associated with cycling. Findings from the review of policy guidelines reveal that lighting in cycling infrastructure is increasingly being considered, not only for the safety of cyclists, but also to make utility cycling more appealing and accessible at night."

- key: ito_where_2023
  path: "/publications/ito-where-2023/"
  title: "Where to invest in cycle parking: A portfolio management approach to spatial transport planning"
  date: "2023-07-01"
  year: 2023
  type: Journal Article
  venue: "Environment and Planning B: Urban Analytics and City Science"
  doi: 10.1177/23998083221138575
  url: ""
  authors: "Yuhei Ito, Malcolm Morgan, Robin Lovelace"
  abstract: "A lack of cycle parking is a known barrier to promoting the uptake of cycling in urban areas. Unlike cars that can be parked on the roadside with little additional infrastructure, bikes usually require dedicated parking facilities. The existing research and guidance on where cycle parking should be provided primarily focuses on key destinations such as train stations or schools. Thus, there is a gap in knowledge about the amount of general-purpose cycle parking required and how it should be distributed across a city. This paper presents a novel method for analysing and prioritising the spatial distribution of cycle parking. The method draws on established portfolio management techniques but applies them in a spatial context. Using the case study of London, we demonstrate that it is possible to identify areas that have a deficit of cycle parking as well as locations that have the most significant potential for increasing cycling uptake by providing additional cycle parking."

- key: pritchard_sykkelpotensial_2022
  path: "/publications/pritchard-sykkelpotensial-2022/"
  title: "Sykkelpotensial og bysykler En beregning av potensialet for økt hverdagssykling og evaluering av bysykkelordningene på Nord-Jæren, i Trondheim og i Bergen"
  date: "2022-01-01"
  year: 2022
  type: Book
  venue: 117
  doi: ""
  url: "https://norceresearch.brage.unit.no/norceresearch-xmlui/handle/11250/2994058"
  authors: "Ray Pritchard, Robin Lovelace"
  abstract: "Det er to hovedformål med denne studien. Det første er å modellere potensialet for økt sykling i Trondheim og på Nord-Jæren ved bruk av en metode som kalles for «Propensity to Cycle Tool». To scenarioer for fremtidig sykling basert på sykkeltilrettelegging og elsykkeleierskap er modellert. Interaktive kart som viser den kombinerte effekten av sykkeltilrettelegging og elsykkeleierskap er tilgjengelige som en del av denne rapporten. Det andre formålet er å evaluere effekten av og bruksmønsteret for bysykkelordningene i Trondheim, Bergen og Nord-Jæren i perioden 2018-2021."

- key: lovelace_open_2021
  path: "/publications/lovelace-open-2021/"
  title: Open source tools for geographic analysis in transport planning
  date: "2021-01-01"
  year: 2021
  type: Journal Article
  venue: Journal of Geographical Systems
  doi: "10.1007/s10109-020-00342-2"
  url: ""
  authors: Robin Lovelace
  abstract: "Geographic analysis has long supported transport plans that are appropriate to local contexts. Many incumbent “tools of the trade” are proprietary and were developed to support growth in motor traffic, limiting their utility for transport planners who have been tasked with twenty-first century objectives such as enabling citizen participation, reducing pollution, and increasing levels of physical activity by getting more people walking and cycling. Geographic techniquessuch as route analysis, network editing, localised impact assessment and interactive map visualisationhave great potential to support modern transport planning priorities. The aim of this paper is to explore emerging open source tools for geographic analysis in transport planning, with reference to the literature and a review of open source tools that are already being used. A key finding is that a growing number of options exist, challenging the current landscape of proprietary tools. These can be classified as command-line interface, graphical user interface or web-based user interface tools and by the framework in which they were implemented, with numerous tools released as R, Python and JavaScript packages, and QGIS plugins. The review found a diverse and rapidly evolving “ecosystem” tools, with 25 tools that were designed for geographic analysis to support transport planning outlined in terms of their popularity and functionality based on online documentation. They ranged in size from single-purpose tools such as the QGIS plugin AwaP to sophisticated stand-alone multi-modal traffic simulation software such as MATSim, SUMO and Veins. Building on their ability to re-use the most effective components from other open source projects, developers of open source transport planning tools can avoid “reinventing the wheel” and focus on innovation, the “gamified” A/B Street https://github.com/dabreegster/abstreet/#abstreetsimulation software, based on OpenStreetMap, a case in point. The paper, the source code of which can be found at https://github.com/robinlovelace/open-gat, concludes that, although many of the tools reviewed are still evolving and further research is needed to understand their relative strengths and barriers to uptake, open source tools for geographic analysis in transport planning already hold great potential to help generate the strategic visions of change and evidence that is needed by transport planners in the twenty-first century."

- key: moreno_monroy_public_2018
  path: "/publications/moreno-monroy-public-2018/"
  title: "Public transport and school location impacts on educational inequalities: Insights from São Paulo"
  date: "2018-02-01"
  year: 2018
  type: Journal Article
  venue: Journal of Transport Geography
  doi: 10.1016/j.jtrangeo.2017.08.012
  url: ""
  authors: "Ana I. Moreno-Monroy, Robin Lovelace, Frederico R. Ramos"
  abstract: "In many large Latin American urban areas such as the São Paulo Metropolitan Region (SPMR), growing social and economic inequalities are embedded through high spatial inequality in the provision of state schools and affordable public transport to these schools. This paper sheds light on the transport-education inequality nexus with reference to school accessibility by public transport in the SPMR. To assess school accessibility, we develop an accessibility index which combines information on the spatial distribution of adolescents, the location of existing schools, and the public transport provision serving the school catchment area into a single measure. The index is used to measure school accessibility locally across 633 areas within the SPMR. We use the index to simulate the impact of a policy aiming at increasing the centralisation of public secondary education provision, and find that it negatively affects public transport accessibility for students with the lowest levels of accessibility. These results illustrate how existing inequalities can be amplified by variable accessibility to schools across income groups and geographical space. The research suggests that educational inequality impacts of school agglomeration policies should be considered before centralisation takes place."

