project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!old-site/**"
  pre-render:
    - scripts/generate_upcoming_events.py
    - scripts/generate_publications_yml.py
  resources:
    - _redirects
    - robots.txt
    - llms.txt

# Meta
description-meta: "Personal website of Robin Lovelace"
author-meta: "Robin Lovelace"

website:
  title: "Robin Lovelace"
  image: "files/images/avatar.png"
  description: "Personal website of Robin Lovelace"
 
  navbar:
    pinned: false

    left:
      - text: Home
        href: index.qmd
      - text: Posts
        href: posts/
      - text: Software
        href: software/
      - text: Projects
        href: projects/
      - text: Now
        href: now/
      - text: Events
        href: events/
      - text: Publications
        href: publications/
#      - text: Teaching
#        href: teaching/
#      - text: People
#        href: people/
      - text: Contact
        href: contact/

    right: 
      - icon: github
        href: https://github.com/Robinlovelace
        target: _blank
      - icon: rss
        href: posts/index.xml
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "[Robin Lovelace](https://github.com/Robinlovelace) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Built with [Quarto](https://quarto.org)"
    right:  
      - icon: github
        href: https://github.com/Robinlovelace/robinlovelace.github.io
        target: _blank
      - icon: rss
        href: posts/index.xml
        target: _blank  
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true
  back-to-top-navigation: true

  draft-mode: visible
  
  repo-url: https://github.com/Robinlovelace/robinlovelace.net
  repo-actions: [edit, issue]
  
  open-graph: true
  
  twitter-card: true 

  site-url: "https://robinlovelace.net"
bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: [cosmo, brand]
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/robinlovelace\.net\/'
    css: custom.css
    include-after-body:
      - text: |
          <script data-goatcounter="https://YOURCODE.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
      - text: |
          <script>
          (async function() {
            try {
              const r = await fetch('/deploy.json');
              if (!r.ok) return;
              const d = await r.json();
              const ft = document.querySelector('.nav-footer-center');
              if (ft) ft.innerHTML += ' · <span class="deploy-timestamp">Deployed ' + d.date + '</span>';
            } catch(e) {}
          })();
          </script>

